name: Flux APK

# Builds an optimized (R8, release) APK of Flux and publishes it as a GitHub pre-release, so it can
# be downloaded and installed straight from a phone.
# Signing: when the FLUX_KEYSTORE_BASE64 / FLUX_KEYSTORE_PASSWORD (and optional FLUX_KEY_ALIAS)
# secrets exist, every build is signed with that permanent key, so new builds install over old ones.
# Without them a throwaway key is generated per run (uninstall the previous build before installing).

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths-ignore:
      - "**.md"
      - "assets/**"
      - "fastlane/**"
      - "LICENSE"

permissions:
  contents: write

concurrency:
  group: flux-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build optimized APK
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      STORE_PASSWORD: ${{ secrets.FLUX_KEYSTORE_PASSWORD || 'flux-ci-store' }}
      KEY_PASSWORD: ${{ secrets.FLUX_KEYSTORE_PASSWORD || 'flux-ci-store' }}
      KEY_ALIAS: ${{ secrets.FLUX_KEY_ALIAS || 'flux' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK components
        shell: bash
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "ndk;28.2.13676358" "cmake;3.22.1" > /dev/null || true
          "$SDKM" --install "platforms;android-37" > /dev/null || true

      - name: Prepare signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.FLUX_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Using the permanent signing key from the repository secrets."
            echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks
          else
            echo "::warning title=Signing::No FLUX_KEYSTORE_BASE64 secret: signing with a throwaway key."
            keytool -genkeypair -noprompt \
              -keystore keystore.jks \
              -storepass "$STORE_PASSWORD" -keypass "$KEY_PASSWORD" \
              -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Flux, O=Flux, C=BR"
          fi

      - name: Build release APK
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleUniversalGmsRelease --continue --stacktrace 2>&1 | tee build.log

      - name: Report build errors
        if: failure()
        shell: bash
        run: |
          # Surface the real failure reason as annotations (readable from the checks API).
          python3 - <<'PY'
          lines = open("build.log", encoding="utf-8", errors="replace").read().splitlines()
          picked = []
          for i, l in enumerate(lines):
              if "What went wrong" in l:
                  block = []
                  for nxt in lines[i + 1:i + 40]:
                      if nxt.startswith("* Try:"):
                          break
                      block.append(nxt)
                  picked.append("WHAT WENT WRONG: " + " | ".join(x.strip() for x in block if x.strip())[:1500])
          kotlin = [l for l in lines if l.startswith("e: ")]
          other = [l for l in lines if ("error:" in l.lower() or "Execution failed for task" in l) and not l.startswith("e: ")]
          items = picked + kotlin[:60] + other[:20]
          if not items:
              items = lines[-30:]
          batches = [items[i:i + 6] for i in range(0, len(items), 6)][:9]
          for batch in batches:
              msg = "%0A".join(b.replace("%", "%25").replace("\r", "")[:900] for b in batch)
              print(f"::error title=Build error::{msg}")
          PY

      - name: Publish full build log (on failure)
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Push the complete log to a throwaway `ci-logs` branch so it can be read with plain git.
          LOGDIR="$RUNNER_TEMP/ci-logs"
          rm -rf "$LOGDIR" && mkdir -p "$LOGDIR" && cd "$LOGDIR"
          git init -q
          cp "$GITHUB_WORKSPACE/build.log" build.log || echo "no build.log" > build.log
          git add build.log
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "build log for run ${GITHUB_RUN_NUMBER}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/ci-logs

      - name: Collect APK
        shell: bash
        run: |
          mkdir -p dist
          APK=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "Found $APK"
          cp "$APK" "dist/Flux-build${GITHUB_RUN_NUMBER}.apk"
          ls -la dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Flux-APK
          path: dist/*.apk

      - name: Publish pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="flux-build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" dist/*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Flux (build ${GITHUB_RUN_NUMBER})" \
            --notes "Optimized release build of Flux (commit ${GITHUB_SHA::7}). Flux is a fork of Echo Music, licensed under GPL-3.0." \
            --prerelease
