name: Premium UI APK

# Builds an optimized (R8, release) APK of the premium UI branch and publishes it as a GitHub
# pre-release, so it can be downloaded and installed straight from a phone.
# The signing key is generated per run (throwaway): uninstall a previous build of this fork before
# installing a newer one if Android reports a signature conflict.

on:
  workflow_dispatch:
  push:
    branches: ["premium-ui"]

permissions:
  contents: write

concurrency:
  group: premium-ui-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build optimized APK
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      STORE_PASSWORD: premium-ui-store
      KEY_PASSWORD: premium-ui-store
      KEY_ALIAS: premiumui

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK components
        shell: bash
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "ndk;28.2.13676358" "cmake;3.22.1" > /dev/null || true
          "$SDKM" --install "platforms;android-37" > /dev/null || true

      - name: Create throwaway signing key
        shell: bash
        run: |
          keytool -genkeypair -noprompt \
            -keystore keystore.jks \
            -storepass "$STORE_PASSWORD" -keypass "$KEY_PASSWORD" \
            -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Echo Music Premium UI, O=Community fork, C=BR"

      - name: Build release APK
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleUniversalGmsRelease -PpremiumUiBuild=true --continue --stacktrace 2>&1 | tee build.log

      - name: Report build errors
        if: failure()
        shell: bash
        run: |
          # Surface the real failure reason as annotations (readable from the checks API).
          python3 - <<'PY'
          lines = open("build.log", encoding="utf-8", errors="replace").read().splitlines()
          picked = []
          for i, l in enumerate(lines):
              if "What went wrong" in l:
                  block = []
                  for nxt in lines[i + 1:i + 40]:
                      if nxt.startswith("* Try:"):
                          break
                      block.append(nxt)
                  picked.append("WHAT WENT WRONG: " + " | ".join(x.strip() for x in block if x.strip())[:1500])
          kotlin = [l for l in lines if l.startswith("e: ")]
          other = [l for l in lines if ("error:" in l.lower() or "Execution failed for task" in l) and not l.startswith("e: ")]
          items = picked + kotlin[:60] + other[:20]
          if not items:
              items = lines[-30:]
          batches = [items[i:i + 6] for i in range(0, len(items), 6)][:9]
          for batch in batches:
              msg = "%0A".join(b.replace("%", "%25").replace("\r", "")[:900] for b in batch)
              print(f"::error title=Build error::{msg}")
          PY

      - name: Publish full build log (on failure)
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Push the complete log to a throwaway `ci-logs` branch so it can be read with plain git.
          LOGDIR="$RUNNER_TEMP/ci-logs"
          rm -rf "$LOGDIR" && mkdir -p "$LOGDIR" && cd "$LOGDIR"
          git init -q
          cp "$GITHUB_WORKSPACE/build.log" build.log || echo "no build.log" > build.log
          git add build.log
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "build log for run ${GITHUB_RUN_NUMBER}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/ci-logs

      - name: Collect APK
        shell: bash
        run: |
          mkdir -p dist
          APK=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "Found $APK"
          cp "$APK" "dist/EchoMusic-PremiumUI-${GITHUB_RUN_NUMBER}.apk"
          ls -la dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: EchoMusic-PremiumUI-APK
          path: dist/*.apk

      - name: Publish pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="premium-ui-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" dist/*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Echo Music – Premium UI (build ${GITHUB_RUN_NUMBER})" \
            --notes "Optimized release build of the premium UI branch (commit ${GITHUB_SHA::7}). Signed with a throwaway key: uninstall older builds of this fork if Android reports a conflict." \
            --prerelease
