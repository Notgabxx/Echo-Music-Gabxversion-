name: Premium UI APK

# Builds an optimized (R8, release) APK of the premium UI branch and publishes it as a GitHub
# pre-release, so it can be downloaded and installed straight from a phone.
# The signing key is generated per run (throwaway): uninstall a previous build of this fork before
# installing a newer one if Android reports a signature conflict.

on:
  workflow_dispatch:
  push:
    branches: ["premium-ui"]

permissions:
  contents: write

concurrency:
  group: premium-ui-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build optimized APK
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      STORE_PASSWORD: premium-ui-store
      KEY_PASSWORD: premium-ui-store
      KEY_ALIAS: premiumui

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK components
        shell: bash
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "ndk;28.2.13676358" "cmake;3.22.1" > /dev/null || true
          "$SDKM" --install "platforms;android-37" > /dev/null || true

      - name: Create throwaway signing key
        shell: bash
        run: |
          keytool -genkeypair -noprompt \
            -keystore keystore.jks \
            -storepass "$STORE_PASSWORD" -keypass "$KEY_PASSWORD" \
            -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Echo Music Premium UI, O=Community fork, C=BR"

      - name: Build release APK
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleUniversalGmsRelease -PpremiumUiBuild=true --stacktrace 2>&1 | tee build.log

      - name: Report build errors
        if: failure()
        shell: bash
        run: |
          # Surface compiler errors as annotations (readable from the checks API and the run page).
          python3 - <<'PY'
          import re
          lines = open("build.log", encoding="utf-8", errors="replace").read().splitlines()
          errors = [l for l in lines if l.startswith("e: ") or "error:" in l or "FAILURE:" in l or "What went wrong" in l]
          if not errors:
              errors = lines[-40:]
          batches = [errors[i:i + 6] for i in range(0, min(len(errors), 60), 6)]
          for batch in batches[:10]:
              msg = "%0A".join(b.replace("%", "%25").replace("\r", "") for b in batch)
              print(f"::error title=Build error::{msg}")
          PY

      - name: Collect APK
        shell: bash
        run: |
          mkdir -p dist
          APK=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "Found $APK"
          cp "$APK" "dist/EchoMusic-PremiumUI-${GITHUB_RUN_NUMBER}.apk"
          ls -la dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: EchoMusic-PremiumUI-APK
          path: dist/*.apk

      - name: Publish pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="premium-ui-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" dist/*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Echo Music – Premium UI (build ${GITHUB_RUN_NUMBER})" \
            --notes "Optimized release build of the premium UI branch (commit ${GITHUB_SHA::7}). Signed with a throwaway key: uninstall older builds of this fork if Android reports a conflict." \
            --prerelease
